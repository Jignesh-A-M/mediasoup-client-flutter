name: mediasoup_client_flutter
description: >
  Vendored fork of Blancduman/mediasoup-client-flutter 0.8.5 (last published
  2023-06-08, pub.dev flags it has:error), ported to flutter_webrtc ^1.5.2
  (was ^0.9.33) for CallMateAI's mediasoup SFU migration — see PROJECT.md
  "Calling architecture" and LESSONS.md. Only the unified_plan handler is
  kept; plan_b.dart (legacy SDP mode, unused) was dropped.
version: 0.8.5+callmateai.1
homepage: https://github.com/Blancduman/mediasoup-client-flutter
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.5.2
  events2:
    path: ../events2
  sdp_transform:
    path: ../sdp_transform
  collection: ^1.19.0
  h264_profile_level_id: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.9.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

